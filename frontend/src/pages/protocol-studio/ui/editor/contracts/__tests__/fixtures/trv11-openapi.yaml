openapi: 3.0.0
info:
  title: ONDC Specification
  description: ONDC Specification
  version: 2.1.0
  domain: ONDC:TRV11
paths:
  /search:
    post:
      tags:
        - Provider Platform
        - Gateway
      description: Consumer Platform declares the customer's intent to buy/avail
        products or services
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                context:
                  allOf:
                    - $ref: "#/components/schemas/Context"
                    - properties:
                        action:
                          enum:
                            - search
                message:
                  type: object
                  additionalProperties: false
                  properties:
                    intent:
                      $ref: "#/components/schemas/Intent"
              required:
                - context
                - message
      responses:
        default:
          $ref: "#/paths/~1on_search/post/responses/default"
  /on_search:
    post:
      description: Provider Platform sends its catalog in response to a search
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  allOf:
                    - $ref: "#/components/schemas/Context"
                    - properties:
                        action:
                          enum:
                            - on_search
                message:
                  type: object
                  properties:
                    catalog:
                      $ref: "#/components/schemas/Catalog"
              required:
                - context
      responses:
        default:
          description: Acknowledgement of message received
components:
  schemas:
    Context:
      type: object
      properties:
        action:
          type: string
          description: The Beckn endpoint called
        location:
          type: object
          properties:
            country:
              type: object
              properties:
                code:
                  type: string
            city:
              type: object
              properties:
                code:
                  type: string
        transaction_id:
          type: string
          format: uuid
      required:
        - action
        - transaction_id
    Intent:
      type: object
      properties:
        fulfillment:
          $ref: "#/components/schemas/Fulfillment"
        payment:
          type: object
          properties:
            tags:
              type: array
              items:
                $ref: "#/components/schemas/TagGroup"
    Fulfillment:
      type: object
      properties:
        type:
          type: string
          enum:
            - TRIP
        vehicle:
          type: object
          properties:
            category:
              type: string
              enum:
                - BUS
                - METRO
            variant:
              type: string
        stops:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
              parent_stop:
                $ref: "#/components/schemas/Fulfillment"
    TagGroup:
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        list:
          type: array
          items:
            type: object
            properties:
              descriptor:
                $ref: "#/components/schemas/Descriptor"
              value:
                type: string
    Descriptor:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
    Catalog:
      type: object
      properties:
        descriptor:
          $ref: "#/components/schemas/Descriptor"
        providers:
          type: array
          items:
            oneOf:
              - type: object
                properties:
                  id:
                    type: string
              - type: object
                properties:
                  categories:
                    type: array
                    items:
                      type: string
