<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/png" href="/ondc_fav.png" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;600&display=swap"
            rel="stylesheet"
        />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ONDC Workbench</title>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-JEZFPTBKF0"></script>
        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            // The MCP session viewer receives an engine token in the URL
            // fragment, and GA4 reports `page_location` as
            // `document.location.href` — fragment included. Never configure
            // analytics on that route: it would ship somebody else's
            // credential to a third party.
            if (!window.location.pathname.startsWith("/mcp-session")) {
                gtag("config", "G-JEZFPTBKF0");
            }
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
